<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3182ce;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fundo circular -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  
  <!-- Frasco simplificado -->
  <g transform="translate(50, 50)">
    <!-- Corpo -->
    <path d="M-20 25 L-12 -15 L12 -15 L20 25 Z" fill="url(#grad3)" opacity="0.95"/>
    
    <!-- Líquido -->
    <path d="M-16 18 L-10 -10 L10 -10 L16 18 Z" fill="url(#grad2)" opacity="0.85"/>
    
    <!-- Gargalo -->
    <rect x="-7" y="-28" width="14" height="13" rx="2" fill="url(#grad3)" opacity="0.9"/>
    
    <!-- Check de segurança -->
    <path d="M18 -8 L22 -4 L28 -12" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
