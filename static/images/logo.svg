<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3182ce;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="successGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sombra -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Fundo circular com gradiente -->
  <circle cx="200" cy="200" r="190" fill="url(#primaryGradient)" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="#4299e1" stroke-width="2" opacity="0.3"/>
  
  <!-- Escudo de segurança (fundo) -->
  <path d="M200 80 L280 120 L280 200 C280 280 200 320 200 320 C200 320 120 280 120 200 L120 120 Z" 
        fill="url(#accentGradient)" opacity="0.2"/>
  
  <!-- Frasco de laboratório (Erlenmeyer) -->
  <g transform="translate(200, 200)">
    <!-- Corpo do frasco -->
    <path d="M-50 60 L-35 -40 L35 -40 L50 60 Z" 
          fill="url(#successGradient)" opacity="0.9"/>
    
    <!-- Líquido no frasco -->
    <path d="M-42 45 L-30 -30 L30 -30 L42 45 Q42 55 35 55 L-35 55 Q-42 55 -42 45 Z" 
          fill="url(#accentGradient)" opacity="0.8"/>
    
    <!-- Bolhas no líquido -->
    <circle cx="-20" cy="20" r="4" fill="#fff" opacity="0.6"/>
    <circle cx="15" cy="10" r="3" fill="#fff" opacity="0.5"/>
    <circle cx="-10" cy="35" r="2.5" fill="#fff" opacity="0.4"/>
    <circle cx="25" cy="30" r="2" fill="#fff" opacity="0.5"/>
    
    <!-- Gargalo do frasco -->
    <rect x="-18" y="-70" width="36" height="30" rx="3" fill="url(#successGradient)" opacity="0.9"/>
    
    <!-- Abertura do frasco -->
    <ellipse cx="0" cy="-70" rx="18" ry="6" fill="url(#accentGradient)" opacity="0.7"/>
    <ellipse cx="0" cy="-70" rx="12" ry="4" fill="#1e3a5f" opacity="0.5"/>
  </g>
  
  <!-- Ícone de check/proteção -->
  <path d="M260 140 L275 155 L295 125" 
        stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" 
        fill="none" opacity="0.9"/>
  
  <!-- Átomos/moléculas decorativas -->
  <g opacity="0.4">
    <!-- Órbita 1 -->
    <ellipse cx="200" cy="200" rx="140" ry="60" 
             fill="none" stroke="#fff" stroke-width="1.5" 
             transform="rotate(-30 200 200)"/>
    <!-- Órbita 2 -->
    <ellipse cx="200" cy="200" rx="140" ry="60" 
             fill="none" stroke="#fff" stroke-width="1.5" 
             transform="rotate(30 200 200)"/>
    <!-- Órbita 3 -->
    <ellipse cx="200" cy="200" rx="140" ry="60" 
             fill="none" stroke="#fff" stroke-width="1.5" 
             transform="rotate(90 200 200)"/>
    
    <!-- Elétrons -->
    <circle cx="280" cy="130" r="6" fill="#48bb78"/>
    <circle cx="120" cy="180" r="6" fill="#4299e1"/>
    <circle cx="200" cy="340" r="6" fill="#ed8936"/>
  </g>
  
  <!-- Texto "C" estilizado -->
  <text x="200" y="380" 
        font-family="Arial, sans-serif" 
        font-size="24" 
        font-weight="bold" 
        fill="#fff" 
        text-anchor="middle" 
        opacity="0.9">CHEMSTORE</text>
</svg>
